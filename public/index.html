<!DOCTYPE html>
<html lang="en">
  <head>
  <!-- MUST be first: decode spa-github-pages ?p=/... payload -->
  <script>
    (function(l){
      if (l.search && l.search.indexOf('?p=') === 0) {
        var params = new URLSearchParams(l.search);
        var p = (params.get('p') || '/').replace(/~and~/g, '&');
        var q = (params.get('q') || '').replace(/~and~/g, '&');
        var newUrl = p + (q ? ('?' + q) : '') + (l.hash || '');
        window.history.replaceState(null, null, newUrl);
      }
    })(window.location);
  </script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />

  <title>Physics Nook</title>
  <meta name="description" content="Interactive physics simulations." />
  <link rel="canonical" href="https://physicsnook.com/" />
  <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Physics Nook" />
  <meta property="og:title" content="Physics Nook — Interactive Physics" />
  <meta property="og:description" content="Interactive physics simulations." />
  <meta property="og:url" content="https://physicsnook.com/" />
  <!-- Optional: replace with a real social image hosted on your domain -->
  <meta property="og:image" content="https://physicsnook.com/og-image.png" />


  <!-- Structured data: basic WebSite + search action (optional) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Physics Nook",
    "url": "https://physicsnook.com/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://physicsnook.com/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Icons & manifest -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
</head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
